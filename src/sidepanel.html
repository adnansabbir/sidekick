<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="light dark" />
        <title>Sidekick</title>
        <link rel="stylesheet" href="./sidepanel.css" />
    </head>
    <body
        class="relative h-full m-0 font-sans text-neutral-900 dark:text-neutral-100 bg-white dark:bg-[radial-gradient(circle_at_82%_20%,#1446843d,transparent_30%),linear-gradient(145deg,#040711_0%,#071022_55%,#060914_100%)]"
    >
        <div class="flex flex-col h-screen">
            <div
                class="relative flex items-center justify-between shrink-0 h-12 px-3 border-b border-black/10 dark:border-white/10"
            >
                <div></div>
                <div class="relative">
                    <button
                        type="button"
                        id="menu-button"
                        title="Menu"
                        aria-label="Menu"
                        aria-haspopup="true"
                        aria-expanded="false"
                        class="flex items-center justify-center shrink-0 w-9 h-9 rounded-full border-0 cursor-pointer bg-transparent hover:bg-black/5 dark:hover:bg-white/10 text-inherit"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                            class="w-5 h-5"
                        >
                            <path
                                d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
                            />
                        </svg>
                    </button>
                    <div
                        id="menu-dropdown"
                        role="menu"
                        class="hidden absolute right-0 top-full mt-1 w-40 rounded-md border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-lg py-1 z-10"
                    >
                        <button
                            type="button"
                            id="settings-menu-item"
                            role="menuitem"
                            class="w-full text-left px-3 py-2 text-sm cursor-pointer hover:bg-black/5 dark:hover:bg-white/10"
                        >
                            Settings
                        </button>
                    </div>
                </div>
            </div>
            <div id="messages" class="flex-1 overflow-y-auto p-4"></div>
            <div
                class="flex items-center gap-2 p-3 border-t border-black/10 dark:border-white/10"
            >
                <div class="relative">
                    <button
                        type="button"
                        id="mic-button"
                        title="Start listening"
                        aria-label="Start listening"
                        aria-haspopup="true"
                        aria-expanded="false"
                        class="flex items-center justify-center shrink-0 w-9 h-9 rounded-full border-0 cursor-pointer bg-black/5 dark:bg-white/10 text-inherit"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                            class="w-5 h-5"
                        >
                            <path
                                d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
                            />
                        </svg>
                    </button>
                    <div
                        id="mic-mode-popup"
                        role="menu"
                        class="hidden absolute bottom-full left-0 mb-2 w-48 py-1 z-10"
                    >
                        <button
                            type="button"
                            id="mic-mode-send"
                            role="menuitem"
                            class="flex items-center gap-2 w-full text-left px-3 py-2 text-sm cursor-pointer bg-transparent border-0"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                aria-hidden="true"
                                class="w-4 h-4 shrink-0"
                            >
                                <path
                                    d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
                                />
                            </svg>
                            Send as I speak
                        </button>
                        <button
                            type="button"
                            id="mic-mode-dictate"
                            role="menuitem"
                            class="flex items-center gap-2 w-full text-left px-3 py-2 text-sm cursor-pointer bg-transparent border-0"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                aria-hidden="true"
                                class="w-4 h-4 shrink-0"
                            >
                                <path
                                    d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"
                                />
                            </svg>
                            Dictate only
                        </button>
                    </div>
                </div>
                <input
                    type="text"
                    id="text-input"
                    placeholder="Type or speak..."
                    aria-label="Command input"
                    class="flex-1 px-2.5 py-2 rounded-md border border-black/15 dark:border-white/15 bg-black/5 dark:bg-white/5 text-inherit font-inherit"
                />
                <button
                    type="button"
                    id="send-button"
                    title="Send"
                    aria-label="Send"
                    class="flex items-center justify-center shrink-0 w-9 h-9 rounded-full border-0 cursor-pointer bg-neutral-900 text-white dark:bg-white dark:text-neutral-900"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        class="w-5 h-5"
                    >
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
        <div
            id="settings-page"
            class="hidden absolute inset-0 z-20 flex flex-col bg-white dark:bg-[radial-gradient(circle_at_82%_20%,#1446843d,transparent_30%),linear-gradient(145deg,#040711_0%,#071022_55%,#060914_100%)]"
        >
            <div
                class="flex items-center gap-2 shrink-0 h-12 px-3 border-b border-black/10 dark:border-white/10"
            >
                <button
                    type="button"
                    id="settings-back-button"
                    title="Back"
                    aria-label="Back"
                    class="flex items-center justify-center shrink-0 w-9 h-9 rounded-full border-0 cursor-pointer bg-transparent hover:bg-black/5 dark:hover:bg-white/10 text-inherit"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                        class="w-5 h-5"
                    >
                        <path
                            d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                        />
                    </svg>
                </button>
                <h2 class="text-sm font-semibold">Settings</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <label
                    for="language-select"
                    class="block text-sm font-medium mb-1"
                >
                    Language
                </label>
                <select
                    id="language-select"
                    class="w-full rounded-md border border-black/15 dark:border-white/15 bg-black/5 dark:bg-white/5 text-inherit px-2.5 py-2 text-sm"
                >
                    <option value="en-US">English (US)</option>
                    <option value="bn-BD">Bangla (Bangladesh)</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="ar-SA">Arabic</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese (Mandarin)</option>
                    <option value="ur-PK">Urdu</option>
                    <option value="de-DE">German</option>
                </select>
            </div>
            <div
                class="flex items-center justify-end gap-2 shrink-0 p-3 border-t border-black/10 dark:border-white/10"
            >
                <button
                    type="button"
                    id="settings-cancel-button"
                    class="px-4 py-2 rounded-md text-sm font-medium cursor-pointer border border-black/15 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10"
                >
                    Cancel
                </button>
                <button
                    type="button"
                    id="settings-save-button"
                    class="px-4 py-2 rounded-md text-sm font-medium cursor-pointer bg-neutral-900 text-white dark:bg-white dark:text-neutral-900"
                >
                    Save
                </button>
            </div>
        </div>
        <script type="module" src="./sidepanel.ts"></script>
    </body>
</html>
